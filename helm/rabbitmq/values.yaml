rabbitmq:
  replicaCount: 1

  image:
    repository: rabbitmq
    tag: "3.12-management"
    pullPolicy: IfNotPresent

  auth:
    username: guest
    existingPasswordSecret: rabbitmq
    existingErlangSecret: rabbitmq

  persistence:
    enabled: true
    storageClass: longhorn-no-replica-no-backup
    size: 1Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false

service:
  type: ClusterIP
