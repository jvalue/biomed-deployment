---
# Custom values for Argo Workflows deployment
# All values under 'argo-workflows' are passed to the upstream chart

argo-workflows:
  images:
    # -- Common tag for Argo Workflows images. Defaults to `.Chart.AppVersion`.
    tag: "v3.7.3"

  workflow:
    serviceAccount:
      create: true

  controller:
    workflowNamespaces:
      - argo-managed-crawler
    persistence:
      archive: true
      postgresql:
        host: argo-workflows-database
        port: 5434
        database: postgres
        tableName: argo_workflows
        userNameSecret:
          name: argo-workflows-db-credentials
          key: POSTGRES_USER
        passwordSecret:
          name: argo-workflows-db-credentials
          key: POSTGRES_PASSWORD

    # Default service account for workflows
    workflowDefaults:
      spec:
        serviceAccountName: argo-workflow

        podGC:
          strategy: OnPodCompletion         # Delete Pods after completion
          deleteDelayDuration: 5m              # Wait 5 minutes before deletion

  server:
    # Run under /argo on the private ingress
    baseHref: /argo/

    extraArgs:
      - --base-href=/argo/

    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: argo-argo-workflows-strip-prefix@kubernetescrd
      ingressClassName: "private-ingress"
      paths:
        - /argo
      pathType: Prefix

    # Auth via token
    authModes:
      - client

  # Konfiguration für Artifact Repository (MinIO)
  useDefaultArtifactRepo: true
  artifactRepository:
    archiveLogs: true
    s3:
      bucket: argo-artifacts
      endpoint: argo-workflows-minio.argo.svc.cluster.local:9000
      insecure: true
      accessKeySecret:
        name: argo-workflows-minio
        key: rootUser
      secretKeySecret:
        name: argo-workflows-minio
        key: rootPassword

# MinIO Configuration
# All values under 'minio' are passed to the upstream MinIO chart
minio:
  mode: standalone

  rootUser: minioadmin
  rootPassword: CHANGE_ME_MINIO_PASSWORD

  persistence:
    enabled: true
    storageClass: "longhorn-basic-backup"
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Bucket für Argo Artifacts erstellen
  buckets:
    - name: argo-artifacts
      policy: none
      purge: false

