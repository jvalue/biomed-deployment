{{- if .Values.minio }}
{{- $root := . }}
{{- range (index .Values "argo-workflows").controller.workflowNamespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-minio
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/instance: {{ $root.Release.Name }}
type: Opaque
data:
  rootUser: {{ $root.Values.minio.rootUser | b64enc | quote }}
  rootPassword: {{ $root.Values.minio.rootPassword | b64enc | quote }}
{{- end }}
{{- end }}

