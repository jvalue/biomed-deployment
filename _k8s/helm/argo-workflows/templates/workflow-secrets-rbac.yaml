apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-workflow-secrets-reader
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # Allow reading the MinIO secret from the argo namespace
  # The MinIO chart creates this secret from existingSecret (minio-credentials)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argo-workflows-minio"]
    verbs: ["get"]
  # Also allow access to secrets in the argo namespace for workflow pods
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["argo-workflows-minio"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-workflow-secrets-reader
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflow-secrets-reader
subjects:
  # ServiceAccount of the Argo Workflow controller in the argo-managed-crawler namespace
  - kind: ServiceAccount
    name: argo-workflow
    namespace: argo-managed-crawler

