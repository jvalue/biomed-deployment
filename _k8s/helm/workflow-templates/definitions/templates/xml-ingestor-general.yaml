apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: xml-ingestor-general
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.3"
spec:
  imagePullSecrets:
    - name: ghcr-login-secret
  entrypoint: main
  arguments:
    parameters:
      - name: XSD_PATH
        value: ""
      - name: XML_PATH
        value: ""
      - name: DB_HOST
        value: "xml-db.argo-managed-crawler.svc.cluster.local"
      - name: DB_PORT
        value: "5432"
      - name: DB_SECRET_NAME
        value: "xml-db-credentials"
      - name: COMMIT_EVERY
        value: "1000"
      - name: TABLE_PREFIX
        value: ""
      - name: SCHEMA
        value: ""
      - name: ECHO_SQL
        value: "false"
  templates:
    - name: main
      container:
        image: ghcr.io/jvalue/xml-ingestor:ec1dd64bf4be86bb0655e7e1447e552fe31b2045
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "xml_ingestor.main"]
        env:
          - name: XML_INGESTOR_RUN_NAME
            value: "{{workflow.name}}"
          - name: XML_INGESTOR_RUN_NAMESPACE
            value: "{{workflow.namespace}}"
          - name: XML_INGESTOR_XSD
            value: "{{workflow.parameters.XSD_PATH}}"
          - name: XML_INGESTOR_XML
            value: "{{workflow.parameters.XML_PATH}}"
          - name: XML_INGESTOR_COMMIT_EVERY
            value: "{{workflow.parameters.COMMIT_EVERY}}"
          - name: XML_INGESTOR_TABLE_PREFIX
            value: "{{workflow.parameters.TABLE_PREFIX}}"
          - name: XML_INGESTOR_SCHEMA
            value: "{{workflow.parameters.SCHEMA}}"
          - name: XML_INGESTOR_ECHO_SQL
            value: "{{workflow.parameters.ECHO_SQL}}"
          - name: S3_ENDPOINT_URL
            value: "http://minio.biomed.svc.cluster.local:9000"
          - name: S3_BUCKET
            value: "biomed-data"
          - name: AWS_DEFAULT_REGION
            value: "eu-central-1"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio
                key: rootUser
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio
                key: rootPassword
          - name: DB_HOST
            value: "{{workflow.parameters.DB_HOST}}"
          - name: DB_PORT
            value: "{{workflow.parameters.DB_PORT}}"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: "{{workflow.parameters.DB_SECRET_NAME}}"
                key: POSTGRES_DB
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: "{{workflow.parameters.DB_SECRET_NAME}}"
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{workflow.parameters.DB_SECRET_NAME}}"
                key: POSTGRES_PASSWORD
          - name: XML_INGESTOR_DATABASE_URL
            value: "postgresql+psycopg2://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
