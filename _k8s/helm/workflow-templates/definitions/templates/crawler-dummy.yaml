apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: crawler-dummy
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.2"
spec:
  imagePullSecrets:
    - name: ghcr-login-secret
  entrypoint: main
  templates:
    - name: main
      container:
        image: ghcr.io/jvalue/crawler-dummy:847c7364535635c709d691698cac60bddabf1f14
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.main"]
        env:
          - name: CRAWLER_RUN_NAME
            value: "{{workflow.name}}"
          - name: CRAWLER_RUN_NAMESPACE
            value: "{{workflow.namespace}}"
          - name: CRAWLER_DUMMY_RUN_NAME
            value: "{{workflow.name}}"
          - name: CRAWLER_DUMMY_RUN_NAMESPACE
            value: "{{workflow.namespace}}"
          - name: CRAWLER_SCHEDULE_NAME
            value: "{{workflow.labels['workflows.argoproj.io/cron-workflow']}}"
          - name: CRAWLER_SCHEDULE_NAMESPACE
            value: "{{workflow.namespace}}"
