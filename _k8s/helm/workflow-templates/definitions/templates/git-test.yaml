apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: git-test
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.3"
spec:
  entrypoint: main
  templates:
    - name: main
      container:
        image: alpine:latest
        command: ["sh", "-c"]
        args:
          - |
            i=1
            while [ "$i" -le 500 ]; do
              echo "Crawling datasets $i..."
              sleep 1
              i=$((i+1))
            done
            sleep 1
