apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: git-test
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.3"
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: phase-1
            template: worker
            arguments:
              parameters:
                - name: batch-id
                  value: "1-{{item}}"
            withSequence:
              count: "3"
        - - name: phase-2
            template: worker
            arguments:
              parameters:
                - name: batch-id
                  value: "2-{{item}}"
            withSequence:
              count: "2"

    - name: worker
      inputs:
        parameters:
          - name: batch-id
      container:
        image: alpine:latest
        command: ["sh", "-c"]
        args:
          - |
            echo "Processing batch {{inputs.parameters.batch-id}}..."
            i=1
            while [ "$i" -le 10 ]; do
              echo "Batch {{inputs.parameters.batch-id}}: Item $i..."
              sleep 1
              i=$((i+1))
            done
            echo "Batch {{inputs.parameters.batch-id}} completed."
