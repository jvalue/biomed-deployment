apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: crawler-general
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.2"
spec:
  imagePullSecrets:
    - name: ghcr-login-secret
  entrypoint: main
  arguments:
    parameters:
      - name: targetUrl
        value: ""
      - name: FTP_USER
        value: "anonymous"
      - name: FTP_PASSWORD
        value: "anonymous"
      - name: FTP_STRUCTURE_FILE
        value: "ftp_structure.txt"
      - name: FTP_MAX_DEPTH
        value: "1"
  templates:
    - name: main
      container:
        image: ghcr.io/jvalue/crawler-general:847c7364535635c709d691698cac60bddabf1f14
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.main"]
        env:
          - name: CRAWLER_RUN_NAME
            value: "{{workflow.name}}"
          - name: CRAWLER_RUN_NAMESPACE
            value: "{{workflow.namespace}}"
          - name: CRAWLER_SCHEDULE_NAME
            value: "{{workflow.labels['workflows.argoproj.io/cron-workflow']}}"
          - name: CRAWLER_SCHEDULE_NAMESPACE
            value: "{{workflow.namespace}}"
          - name: FTP_URL
            value: "{{workflow.parameters.targetUrl}}"
          - name: FTP_USER
            value: "{{workflow.parameters.FTP_USER}}"
          - name: FTP_PASSWORD
            value: "{{workflow.parameters.FTP_PASSWORD}}"
          - name: FTP_STRUCTURE_FILE
            value: "{{workflow.parameters.FTP_STRUCTURE_FILE}}"
          - name: FTP_MAX_DEPTH
            value: "{{workflow.parameters.FTP_MAX_DEPTH}}"
          - name: DB_HOST
            value: "crawler-db.argo-managed-crawler.svc.cluster.local"
          - name: DB_PORT
            value: "5436"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: crawler-db-credentials
                key: POSTGRES_DB
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: crawler-db-credentials
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: crawler-db-credentials
                key: POSTGRES_PASSWORD
