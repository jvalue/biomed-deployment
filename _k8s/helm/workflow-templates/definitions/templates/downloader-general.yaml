apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: downloader-general
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.0"
spec:
  imagePullSecrets:
    - name: ghcr-login-secret
  entrypoint: main
  arguments:
    parameters: []
  templates:
    - name: main
      container:
        image: ghcr.io/jvalue/downloader-general:0e3a16b88bba47b67ddc9b343bfebd5b553086dc
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.main"]
        env:
          - name: DOWNLOADER_RUN_NAME
            value: "{{workflow.name}}"
          - name: DOWNLOADER_RUN_NAMESPACE
            value: "{{workflow.namespace}}"
          # RabbitMQ consumer configuration
          - name: RABBITMQ_URL
            value: "amqp://guest:CHANGE_ME@rabbitmq.argo-managed-crawler.svc.cluster.local:5672/"
          - name: RABBITMQ_QUEUE
            value: "download-urls"
          # MinIO/S3 configuration
          - name: S3_ENDPOINT_URL
            value: "http://minio.biomed.svc.cluster.local:9000"
          - name: S3_BUCKET
            value: "biomed-data"
          - name: S3_UPLOAD_PREFIX
            value: "downloader-files"
          - name: S3_DEBUG_PREFIX
            value: "downloader-debug"
          - name: AWS_ACCESS_KEY_ID
            value: "minioadmin"
          - name: AWS_SECRET_ACCESS_KEY
            value: "minioadmin"
          # Download configuration
          - name: DOWNLOAD_DESTINATION_DIR
            value: "/tmp/downloader-general"
          - name: DOWNLOAD_TIMEOUT_SECONDS
            value: "30"
          - name: DOWNLOAD_DEBUG_LARGE_FILE_MODE
            value: "false"
          - name: DOWNLOAD_DEBUG_LARGE_FILE_THRESHOLD_MB
            value: "100"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
