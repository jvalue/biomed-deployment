apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: downloader-general
  namespace: argo-managed-crawler
  labels:
    template-version: "1.0.6"
spec:
  imagePullSecrets:
    - name: ghcr-login-secret
  entrypoint: main
  arguments:
    parameters:
      - name: DOWNLOAD_DEBUG_LARGE_FILE_MODE
        value: "false"
      - name: DOWNLOAD_DEBUG_LARGE_FILE_THRESHOLD_MB
        value: "100"
      - name: DOWNLOAD_DEBUG_MAX_FILES_PER_FOLDER
        value: "0"
      - name: DB_HOST
        value: "crawler-db.argo-managed-crawler.svc.cluster.local"
      - name: DB_PORT
        value: "5436"
      - name: LOG_LEVEL
        value: "INFO"
  templates:
    - name: main
      container:
        image: ghcr.io/jvalue/downloader-general:178dc2244ba18923a58a44b43669b581a502e78d
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.main"]
        env:
          - name: DOWNLOADER_RUN_NAME
            value: "{{workflow.name}}"
          - name: DOWNLOADER_RUN_NAMESPACE
            value: "{{workflow.namespace}}"
          - name: LOG_LEVEL
            value: "{{workflow.parameters.LOG_LEVEL}}"
          # RabbitMQ consumer configuration
          - name: RABBITMQ_URL
            value: "amqp://guest:CHANGE_ME@rabbitmq.argo-managed-crawler.svc.cluster.local:5672/"
          - name: RABBITMQ_QUEUE
            value: "download-urls"
          # MinIO/S3 configuration
          - name: S3_ENDPOINT_URL
            value: "http://minio.biomed.svc.cluster.local:9000"
          - name: S3_BUCKET
            value: "biomed-data"
          - name: S3_UPLOAD_PREFIX
            value: "downloader-files"
          - name: S3_DEBUG_PREFIX
            value: "downloader-debug"
          - name: AWS_ACCESS_KEY_ID
            value: "minioadmin"
          - name: AWS_SECRET_ACCESS_KEY
            value: "minioadmin"
          # Download configuration
          - name: DOWNLOAD_DESTINATION_DIR
            value: "/tmp/downloader-general"
          - name: DOWNLOAD_TIMEOUT_SECONDS
            value: "30"
          - name: DOWNLOAD_DEBUG_LARGE_FILE_MODE
            value: "{{workflow.parameters.DOWNLOAD_DEBUG_LARGE_FILE_MODE}}"
          - name: DOWNLOAD_DEBUG_LARGE_FILE_THRESHOLD_MB
            value: "{{workflow.parameters.DOWNLOAD_DEBUG_LARGE_FILE_THRESHOLD_MB}}"
          - name: DOWNLOAD_DEBUG_MAX_FILES_PER_FOLDER
            value: "{{workflow.parameters.DOWNLOAD_DEBUG_MAX_FILES_PER_FOLDER}}"
          # Database configuration for marking downloaded entries
          - name: DB_HOST
            value: "crawler-db.argo-managed-crawler.svc.cluster.local"
          - name: DB_PORT
            value: "5436"
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: crawler-db-credentials
                key: POSTGRES_DB
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: crawler-db-credentials
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: crawler-db-credentials
                key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
