apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: test-git-1
  namespace: argo-managed-crawler
  labels:
    managed-by: biomed-management-ui
    created-by: d585b008-cf94-435b-87a6-aa12c8ce0ac2
    created-by-fallback: admin
spec:
  schedules:
    - '* * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 0
  workflowSpec:
    workflowTemplateRef:
      name: test-params-git-3
    arguments:
      parameters:
        - name: repo
          value: https://example.com/repo.git
        - name: branch
          value: main
        - name: commit
          value: HEAD
        - name: build_id
          value: '1234'
        - name: image_tag
          value: latest
        - name: notify_email
          value: dev@example.com
        - name: verbose
          value: 'false'
    workflowMetadata:
      labels:
        customSetWorkflowTemplateName: test-params-git-3
