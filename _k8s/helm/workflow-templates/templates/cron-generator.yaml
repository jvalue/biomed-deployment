{{- if .Values.types.cron.enabled -}}
{{- $env := .Values.environment -}}
{{- $pattern := printf "definitions/cron/%s/*.yaml" $env -}}
{{- range $path, $content := .Files.Glob $pattern -}}
  {{- $cwf := $content | toString | fromYaml }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ $cwf.metadata.name }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    environment: {{ $.Values.environment }}
    {{- with $cwf.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceAccountName: argo-workflow
  {{- toYaml $cwf.spec | nindent 2 }}
{{- end }}
{{- end }}

