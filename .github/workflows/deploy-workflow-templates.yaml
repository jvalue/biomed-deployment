name: deploy-workflow-templates

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      deploy_filter:
        description: 'Comma-separated list of templates to deploy (e.g. template1,template2)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: [Linux, k8s-access]
    environment: ${{ inputs.target_env }}

    container:
      image: ubuntu:latest

    steps:
      - name: Install Dependencies
        run: apt-get update && apt-get install -y git curl unzip

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Set Kubeconfig
        # Choose Kubeconfig based on target environment
        run: |
          mkdir -p ~/.kube
          TARGET="${{ inputs.target_env }}"
          
          if [ "$TARGET" == "prod" ]; then
            echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      - name: Determine Deploy Filter
        id: filter
        run: |
          INPUT_FILTER="${{ inputs.deploy_filter }}"

          if [ -z "$INPUT_FILTER" ]; then
            echo "No input provided. Skipping deployment."
            echo "do_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "User input provided. Deploying: $INPUT_FILTER"
            echo "list=$INPUT_FILTER" >> $GITHUB_OUTPUT
            echo "do_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Kubernetes
        if: steps.filter.outputs.do_deploy == 'true'
        run: |
          TARGET="${{ inputs.target_env }}"

          helm upgrade --install workflow-templates ./_k8s/helm/workflow-templates \
            --namespace argo-managed-crawler \
            --values ./_k8s/helm/workflow-templates/values.yaml \
            --set environment=$TARGET \
            --set deployFilter="${{ steps.filter.outputs.list }}" \
            --set types.templates.enabled=true \
            --set types.cron.enabled=false